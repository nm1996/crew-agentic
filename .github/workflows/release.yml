name: Release

# Push a tag such as v0.3.0 to publish a GitHub release with the wheel and
# sdist attached and the matching CHANGELOG.md section as release notes.
# Or run it manually on a branch (Actions → Release → Run workflow): it tags the
# current commit v<pyproject version> and publishes the same release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check that the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != version $version"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists; bump the version first"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - run: uv sync --dev --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no CHANGELOG entry for $VERSION"; exit 1; }
          printf '\n### Install\n\n```bash\nuv tool install https://github.com/%s/releases/download/%s/crew_cli-%s-py3-none-any.whl\n```\n' \
            "$GITHUB_REPOSITORY" "$TAG" "$VERSION" >> notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then target=(--verify-tag); else target=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" dist/* --title "CREW $VERSION" --notes-file notes.md "${target[@]}"
