name: Claude smoke

# Opt-in end-to-end runs against the real Claude Code CLI on every OS.
# Requires the repository secret ANTHROPIC_API_KEY; each run costs a little.
on:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CREW_CLAUDE_SMOKE: "1"
    steps:
      - name: Require the API key secret
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "::error::Set the ANTHROPIC_API_KEY repository secret to run this workflow."
          exit 1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install Claude Code (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: claude --version
      - run: uv sync --dev --locked
      - run: uv run pytest -m claude -s -p no:logging
