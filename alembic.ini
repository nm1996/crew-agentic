# Developer convenience for authoring migrations, e.g.:
#   uv run alembic -c alembic.ini revision --autogenerate -m "add column"
# CREW itself migrates programmatically (crew.persistence.database.migrate).
[alembic]
script_location = src/crew/persistence/migrations
sqlalchemy.url = sqlite:///.crew/dev-migrations.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
